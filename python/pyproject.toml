[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "camera-ui-common"
version = "1.0.23"
description = "camera.ui python utilities"
keywords = ["camera.ui", "python", "utilities"]
readme = "README.md"
license-files = ["LICENSE.md"]
authors = [{ name = "seydx", email = "hi@seydx.dev" }]
maintainers = [{ name = "seydx", email = "hi@seydx.dev" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = ["typing_extensions>=4.16.0", "camera-ui-sdk>=1.2.37"]

[project.optional-dependencies]
test = ["pytest>=9.1.1"]

[project.urls]
Homepage = "https://github.com/cameraui/common"
Documentation = "https://github.com/cameraui/common"
Repository = "https://github.com/cameraui/common"
"Bug Tracker" = "https://github.com/cameraui/common/issues"
Changelog = "https://github.com/cameraui/common/blob/main/CHANGELOG.md"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["camera_ui_common*"]

[tool.setuptools.package-data]
camera_ui_common = ["py.typed"]